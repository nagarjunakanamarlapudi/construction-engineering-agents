[project]
name = "civil-engineering-copilot"
version = "0.1.0"
description = "Grounded RAG and agentic investigation for a connected civil-engineering project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=0.3,<2",
  "langchain-ollama>=1,<2",
  "langchain-openai>=0.3,<2",
  "langfuse>=3,<4",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mem0ai>=2.0.0b2,<3",
  "neo4j>=5.28,<7",
  "networkx>=3.4,<4",
  "openai>=1.100,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "qdrant-client>=1.15,<2",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.48,<2",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bandit[toml]>=1.8,<2",
  "jupyter>=1.1,<2",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civil_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires local Docker data services"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data", ".worktrees", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_mem0_primer_notebook.py" = ["E501"]
"scripts/build_middleware_primer_notebook.py" = ["E501"]
"scripts/build_state_memory_primer_notebook.py" = ["E501"]
"src/civil_copilot/data/synthetic.py" = ["E501"]
"tests/test_public_standards_ingest.py" = ["E501", "S603"]
"tests/unit/test_tracing_policy.py" = ["S105"]

[tool.bandit]
exclude_dirs = ["tests", "data", ".worktrees", ".venv"]
skips = ["B101"]

[tool.uv]
default-groups = ["dev"]
