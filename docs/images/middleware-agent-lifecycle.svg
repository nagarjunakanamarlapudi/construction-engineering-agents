<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Middleware across the agent lifecycle</title>
  <desc id="desc">A domain-neutral flow showing before agent, model hooks, tool hooks, the agent loop, and after agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:700 42px system-ui,sans-serif;fill:#0f172a}.sub{font:22px system-ui,sans-serif;fill:#475569}
      .label{font:700 22px ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.small{font:18px system-ui,sans-serif;fill:#334155}
      .once{fill:#dbeafe;stroke:#2563eb}.model{fill:#ede9fe;stroke:#7c3aed}.tool{fill:#dcfce7;stroke:#16a34a}.core{fill:#fff7ed;stroke:#ea580c}
      .box{stroke-width:3;rx:18;filter:url(#shadow)}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="65" text-anchor="middle" class="title">Middleware Across One Agent Run</text>
  <text x="800" y="102" text-anchor="middle" class="sub">Hooks observe, modify, protect, and bound the loop without rewriting the agent</text>

  <rect x="70" y="170" width="220" height="105" class="box once"/>
  <text x="180" y="215" text-anchor="middle" class="label">before_agent</text>
  <text x="180" y="247" text-anchor="middle" class="small">runs once</text>

  <rect x="355" y="170" width="220" height="105" class="box model"/>
  <text x="465" y="215" text-anchor="middle" class="label">before_model</text>
  <text x="465" y="247" text-anchor="middle" class="small">before every model call</text>

  <rect x="640" y="150" width="320" height="145" class="box model"/>
  <text x="800" y="198" text-anchor="middle" class="label">wrap_model_call</text>
  <text x="800" y="232" text-anchor="middle" class="small">before → MODEL → after</text>
  <rect x="735" y="245" width="130" height="35" rx="10" class="core"/>
  <text x="800" y="269" text-anchor="middle" class="small">model</text>

  <rect x="1025" y="170" width="220" height="105" class="box model"/>
  <text x="1135" y="215" text-anchor="middle" class="label">after_model</text>
  <text x="1135" y="247" text-anchor="middle" class="small">inspect response</text>

  <path d="M290 222 H345" class="arrow"/><path d="M575 222 H630" class="arrow"/><path d="M960 222 H1015" class="arrow"/>

  <path d="M1245 222 H1340 V420 H975" class="arrow"/>
  <text x="1360" y="330" class="small">model selected a tool</text>

  <rect x="610" y="350" width="365" height="145" class="box tool"/>
  <text x="792" y="397" text-anchor="middle" class="label">wrap_tool_call</text>
  <text x="792" y="431" text-anchor="middle" class="small">before → TOOL → after</text>
  <rect x="727" y="444" width="130" height="35" rx="10" class="core"/>
  <text x="792" y="468" text-anchor="middle" class="small">tool</text>

  <path d="M610 422 H500 V300 H465 V285" class="arrow"/>
  <text x="310" y="404" class="small">tool observation returns to the loop</text>

  <path d="M1245 222 H1470 V650 H1215" class="arrow"/>
  <text x="1300" y="620" class="small">no more tools</text>
  <rect x="930" y="595" width="285" height="110" class="box once"/>
  <text x="1072" y="643" text-anchor="middle" class="label">after_agent</text>
  <text x="1072" y="675" text-anchor="middle" class="small">runs once</text>

  <rect x="170" y="750" width="1260" height="90" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="786" text-anchor="middle" class="small">Node hooks: before_agent · before_model · after_model · after_agent</text>
  <text x="800" y="818" text-anchor="middle" class="small">Wrap hooks: wrap_model_call and wrap_tool_call surround the operation and can handle errors or modify requests</text>
</svg>
